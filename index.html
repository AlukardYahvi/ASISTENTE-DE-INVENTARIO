<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabManager Pro - Panel Principal</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babel para React/JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc; /* slate-50 */
      color: #0f172a; /* slate-900 */
      margin: 0;
      padding: 0;
    }

    /* Animaciones suaves */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    @keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
    .animate-slide-in-right { animation: slideInRight 0.3s ease-out forwards; }

    /* Scrollbar estilizado */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    /* Efectos Glassmorphism */
    .glass-panel {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .glass-sidebar {
      background: rgba(15, 23, 42, 0.95); /* slate-900 */
      backdrop-filter: blur(12px);
    }

    /* Ocultar barra de scroll en móviles pero permitir scroll */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    
    // Firebase Imports
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { 
      getAuth, 
      onAuthStateChanged, 
      signInWithEmailAndPassword,
      signInWithPopup,
      GoogleAuthProvider,
      signOut
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { 
      getFirestore, 
      collection, 
      onSnapshot, 
      query, 
      orderBy, 
      limit 
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // Iconos de Lucide
    import * as LucideIcons from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';
    const { 
      LayoutDashboard, FolderOpen, ScanLine, Settings, LogOut, 
      Boxes, Search, Bell, Menu, X, ChevronRight, Activity, 
      Users, Beaker, Dna, FlaskConical, AlertTriangle, CheckCircle2,
      Clock, ArrowRight, ShieldAlert, Zap, Lock
    } = LucideIcons;

    // Configuración de Firebase (asegúrate de que coincida con tus otros archivos)
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDeaQnmO8nRG4stRrbnmONaz_k1EUWqVHc",
      authDomain: "asistente-de-inventario.firebaseapp.com",
      projectId: "asistente-de-inventario",
      storageBucket: "asistente-de-inventario.firebasestorage.app",
      messagingSenderId: "972615078649",
      appId: "1:972615078649:web:a803b9bd801a2481688828"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();
    const appId = 'lab-manager-yahvi';

    // Lista de administradores autorizados
    const SUPER_ADMIN_EMAILS = [
      'yahvi.edsel.hernandez@gmail.com',
      'asistentelicam@gmail.com',
      'nnajerag@ipn.mx',
      'cgomezm310393@gmail.com',
      'avalentinaregab@gmail.com',
      'alymico53@gmail.com'
    ];

    function LoginScreen() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const handleEmailLogin = async (e) => {
        e.preventDefault();
        setError('');
        setLoading(true);
        try {
          await signInWithEmailAndPassword(auth, email, password);
        } catch (err) {
          console.error(err);
          setError('Credenciales inválidas o error de conexión.');
        } finally {
          setLoading(false);
        }
      };

      const handleGoogleLogin = async () => {
        setError('');
        setLoading(true);
        try {
          await signInWithPopup(auth, googleProvider);
        } catch (err) {
          console.error(err);
          setError('Error al iniciar sesión con Google.');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
          {/* Elementos decorativos de fondo */}
          <div className="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-50 animate-pulse"></div>
          <div className="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-emerald-600 rounded-full mix-blend-multiply filter blur-[128px] opacity-50 animate-pulse" style={{ animationDelay: '2s' }}></div>

          <div className="bg-white/10 glass-panel border border-white/20 p-8 rounded-[2rem] shadow-2xl w-full max-w-md z-10 animate-fade-in relative">
            
            <div className="text-center mb-8">
              <div className="bg-gradient-to-br from-blue-500 to-cyan-500 w-16 h-16 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4 transform -rotate-6">
                <Boxes className="text-white" size={32} />
              </div>
              <h1 className="text-3xl font-black text-white tracking-tight">LabManager <span className="text-blue-400">Pro</span></h1>
              <p className="text-slate-300 mt-2 text-sm font-medium">Sistema Integral de Gestión de Laboratorio</p>
            </div>

            {error && (
              <div className="bg-red-500/20 border border-red-500/50 text-red-200 p-4 rounded-xl mb-6 text-sm flex items-start gap-2 animate-slide-in-right">
                <AlertTriangle size={18} className="shrink-0 mt-0.5" />
                <p>{error}</p>
              </div>
            )}

            <form onSubmit={handleEmailLogin} className="space-y-4 mb-6">
              <div>
                <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input 
                  type="email" 
                  value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className="w-full bg-slate-800/50 border border-slate-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 ring-blue-500 transition-all placeholder-slate-500"
                  placeholder="usuario@instituto.mx"
                  required
                />
              </div>
              <div>
                <label className="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Contraseña</label>
                <input 
                  type="password" 
                  value={password}
                  onChange={(e) => setPassword(e.target.value)}
                  className="w-full bg-slate-800/50 border border-slate-600 text-white rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-1 ring-blue-500 transition-all placeholder-slate-500"
                  placeholder="••••••••"
                  required
                />
              </div>
              <button 
                type="submit" 
                disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 mt-4 disabled:opacity-70"
              >
                {loading ? <div className="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div> : <><Lock size={18}/> Iniciar Sesión</>}
              </button>
            </form>

            <div className="relative flex items-center justify-center mb-6">
              <div className="absolute border-t border-slate-600 w-full"></div>
              <span className="bg-slate-900 px-3 text-xs font-bold text-slate-400 uppercase tracking-wider relative z-10 rounded-full">o ingresa con</span>
            </div>

            <button 
              onClick={handleGoogleLogin}
              disabled={loading}
              className="w-full bg-white hover:bg-slate-100 text-slate-800 font-bold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-3 disabled:opacity-70"
            >
              <svg className="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              Google Workspace
            </button>
            
            <p className="text-center text-xs text-slate-400 mt-6 mt-8">
              Solo personal autorizado. Para acceso contacta a tu administrador de laboratorio.
            </p>
          </div>
        </div>
      );
    }

    function MainApp() {
      const [user, setUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('dashboard'); // 'dashboard', 'inventory', 'scanner'
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      
      // Estados para métricas globales (mock o reales)
      const [stats, setStats] = useState({
        oligosCount: 0,
        abCount: 0,
        rxCount: 0,
        recentActivity: []
      });

      useEffect(() => {
        const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
          if (currentUser) {
            setUser({
              uid: currentUser.uid,
              email: currentUser.email,
              name: currentUser.displayName || currentUser.email.split('@')[0],
              photoURL: currentUser.photoURL,
              isSuperAdmin: currentUser.email ? SUPER_ADMIN_EMAILS.includes(currentUser.email) : false
            });
            
            // Pasar el token a localStorage de forma segura (simulado para este entorno unificado)
            // En un entorno real, usarías getIdToken() y lo pasarías por query params o localStorage seguro
            currentUser.getIdToken().then(token => {
               window.localStorage.setItem('labmanager_auth_token', token);
            });

            loadGlobalStats();
          } else {
            setUser(null);
            window.localStorage.removeItem('labmanager_auth_token');
          }
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      const loadGlobalStats = () => {
        // En una app real, harías queries a Firestore aquí.
        // Simularemos la carga para la interfaz
        
        // Listener real para Oligos
        const unsubOligos = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'inv_oligos'), (snap) => {
           setStats(prev => ({...prev, oligosCount: snap.size}));
        });
        
        // Listener real para Anticuerpos
        const unsubAbs = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos'), (snap) => {
           setStats(prev => ({...prev, abCount: snap.size}));
        });

        // Listener real para Reactivos
        const unsubRx = onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos'), (snap) => {
           setStats(prev => ({...prev, rxCount: snap.size}));
        });

        // Simulación de actividad reciente para el Dashboard
        setTimeout(() => {
           setStats(prev => ({
             ...prev,
             recentActivity: [
               { id: 1, action: 'Uso de Anticuerpo', item: 'Anti-GAPDH (Rabbit)', user: 'Yahvi Hernández', time: 'Hace 10 min', icon: <Beaker size={16} className="text-indigo-500"/>, color: 'bg-indigo-100' },
               { id: 2, action: 'Registro Nuevo', item: 'Oligo p53-Fwd', user: 'Nayelli Nájera', time: 'Hace 1 hora', icon: <Dna size={16} className="text-emerald-500"/>, color: 'bg-emerald-100' },
               { id: 3, action: 'Alerta Stock Bajo', item: 'SYBR Green 2X', user: 'Sistema', time: 'Hace 3 horas', icon: <AlertTriangle size={16} className="text-amber-500"/>, color: 'bg-amber-100' },
               { id: 4, action: 'Descuento de Reactivo', item: 'Agua DEPC (10mL)', user: 'Alejandro G.', time: 'Ayer', icon: <FlaskConical size={16} className="text-cyan-500"/>, color: 'bg-cyan-100' }
             ]
           }));
        }, 1000);
      };

      const handleLogout = () => {
        if(window.confirm('¿Cerrar sesión de LabManager?')) {
          signOut(auth);
        }
      };

      if (loading) {
        return (
          <div className="h-screen bg-slate-900 flex flex-col items-center justify-center">
            <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500 mb-4"></div>
            <p className="text-blue-400 font-bold animate-pulse">Iniciando entorno seguro...</p>
          </div>
        );
      }

      if (!user) {
        return <LoginScreen />;
      }

      
      const renderDashboard = () => (
        <div className="animate-fade-in space-y-6">
          {/* Bienvenida y Tarjetas de Resumen */}
          <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
            
            {/* Tarjeta de Bienvenida */}
            <div className="md:col-span-8 bg-gradient-to-br from-slate-900 to-slate-800 rounded-3xl p-8 text-white relative overflow-hidden shadow-xl">
               <div className="absolute -right-10 -top-10 text-white/5 transform rotate-12">
                 <Boxes size={250} />
               </div>
               <div className="relative z-10">
                 <h2 className="text-3xl font-black mb-2">¡Hola, {user.name}! 👋</h2>
                 <p className="text-slate-300 mb-8 max-w-lg">Bienvenido al panel central de LabManager Pro. Tienes todo bajo control. Selecciona un módulo para gestionar el inventario.</p>
                 
                 <div className="flex flex-wrap gap-4">
                   <button onClick={() => setActiveTab('inventory')} className="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-colors shadow-lg shadow-blue-500/30">
                     <FolderOpen size={20} /> Explorar Inventarios
                   </button>
                   <button onClick={() => setActiveTab('scanner')} className="bg-slate-700 hover:bg-slate-600 text-white px-6 py-3 rounded-xl font-bold flex items-center gap-2 transition-colors">
                     <ScanLine size={20} /> Escanear Código
                   </button>
                 </div>
               </div>
            </div>

            {/* Estado Rápido */}
            <div className="md:col-span-4 grid grid-rows-3 gap-4">
               <div className="bg-emerald-50 rounded-2xl p-4 flex items-center justify-between border border-emerald-100 shadow-sm cursor-pointer hover:shadow-md transition-all">
                 <div className="flex items-center gap-4">
                   <div className="bg-emerald-200/50 p-3 rounded-xl"><Dna className="text-emerald-700" size={24}/></div>
                   <div><p className="text-xs font-bold text-emerald-600 uppercase">Oligos</p><p className="font-black text-xl text-slate-800">{stats.oligosCount} Registros</p></div>
                 </div>
                 <ChevronRight className="text-emerald-300" />
               </div>
               
               <div className="bg-indigo-50 rounded-2xl p-4 flex items-center justify-between border border-indigo-100 shadow-sm cursor-pointer hover:shadow-md transition-all">
                 <div className="flex items-center gap-4">
                   <div className="bg-indigo-200/50 p-3 rounded-xl"><Beaker className="text-indigo-700" size={24}/></div>
                   <div><p className="text-xs font-bold text-indigo-600 uppercase">Anticuerpos</p><p className="font-black text-xl text-slate-800">{stats.abCount} Registros</p></div>
                 </div>
                 <ChevronRight className="text-indigo-300" />
               </div>

               <div className="bg-cyan-50 rounded-2xl p-4 flex items-center justify-between border border-cyan-100 shadow-sm cursor-pointer hover:shadow-md transition-all">
                 <div className="flex items-center gap-4">
                   <div className="bg-cyan-200/50 p-3 rounded-xl"><FlaskConical className="text-cyan-700" size={24}/></div>
                   <div><p className="text-xs font-bold text-cyan-600 uppercase">Reactivos</p><p className="font-black text-xl text-slate-800">{stats.rxCount} Registros</p></div>
                 </div>
                 <ChevronRight className="text-cyan-300" />
               </div>
            </div>
          </div>

          {/* Segunda Fila: Actividad y Atajos */}
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            {/* Actividad Reciente */}
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
               <div className="flex justify-between items-center mb-6">
                 <h3 className="font-black text-lg text-slate-800 flex items-center gap-2"><Activity size={20} className="text-blue-500"/> Actividad Global</h3>
                 <button className="text-xs font-bold text-blue-600 hover:text-blue-700">Ver Todo</button>
               </div>
               
               <div className="space-y-4">
                 {stats.recentActivity.length > 0 ? stats.recentActivity.map(act => (
                   <div key={act.id} className="flex items-start gap-4 p-3 rounded-2xl hover:bg-slate-50 transition-colors">
                     <div className={`p-2.5 rounded-xl ${act.color} mt-1`}>{act.icon}</div>
                     <div className="flex-1">
                       <p className="font-bold text-slate-800 text-sm">{act.action}: <span className="font-medium text-slate-600">{act.item}</span></p>
                       <div className="flex items-center gap-3 mt-1 text-xs text-slate-400 font-medium">
                         <span className="flex items-center gap-1"><User size={12}/> {act.user}</span>
                         <span className="flex items-center gap-1"><Clock size={12}/> {act.time}</span>
                       </div>
                     </div>
                   </div>
                 )) : (
                   <div className="text-center py-8 text-slate-400">
                     <Clock className="mx-auto mb-2 opacity-50" size={32}/>
                     <p className="text-sm">No hay actividad reciente.</p>
                   </div>
                 )}
               </div>
            </div>

            {/* Atajos Rápidos */}
            <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
               <h3 className="font-black text-lg text-slate-800 flex items-center gap-2 mb-6"><Zap size={20} className="text-amber-500"/> Accesos Rápidos</h3>
               <div className="grid grid-cols-2 gap-4">
                 
                 <a href="inventario_oligos.html" className="group bg-slate-50 p-5 rounded-2xl border border-slate-100 hover:border-emerald-300 hover:shadow-md transition-all flex flex-col items-center text-center gap-3">
                   <div className="bg-white p-3 rounded-full shadow-sm group-hover:scale-110 transition-transform"><Dna className="text-emerald-500" size={28}/></div>
                   <div>
                     <p className="font-bold text-slate-700">Oligos</p>
                     <p className="text-[10px] text-slate-400 font-medium mt-1">Ir al módulo</p>
                   </div>
                 </a>
                 
                 <a href="inventario_anticuerpos.html" className="group bg-slate-50 p-5 rounded-2xl border border-slate-100 hover:border-indigo-300 hover:shadow-md transition-all flex flex-col items-center text-center gap-3">
                   <div className="bg-white p-3 rounded-full shadow-sm group-hover:scale-110 transition-transform"><Beaker className="text-indigo-500" size={28}/></div>
                   <div>
                     <p className="font-bold text-slate-700">Anticuerpos</p>
                     <p className="text-[10px] text-slate-400 font-medium mt-1">Ir al módulo</p>
                   </div>
                 </a>

                 <a href="reactivos.html" className="group bg-slate-50 p-5 rounded-2xl border border-slate-100 hover:border-cyan-300 hover:shadow-md transition-all flex flex-col items-center text-center gap-3">
                   <div className="bg-white p-3 rounded-full shadow-sm group-hover:scale-110 transition-transform"><FlaskConical className="text-cyan-500" size={28}/></div>
                   <div>
                     <p className="font-bold text-slate-700">Reactivos</p>
                     <p className="text-[10px] text-slate-400 font-medium mt-1">Ir al módulo</p>
                   </div>
                 </a>

                 <button onClick={() => setActiveTab('scanner')} className="group bg-slate-800 p-5 rounded-2xl hover:bg-slate-900 shadow-md transition-all flex flex-col items-center text-center gap-3">
                   <div className="bg-white/10 p-3 rounded-full group-hover:scale-110 transition-transform"><ScanLine className="text-blue-400" size={28}/></div>
                   <div>
                     <p className="font-bold text-white">Escáner QR</p>
                     <p className="text-[10px] text-slate-400 font-medium mt-1">Lector de Tubos</p>
                   </div>
                 </button>

               </div>
            </div>

          </div>
        </div>
      );

      const renderInventory = () => (
        <div className="animate-fade-in max-w-5xl mx-auto space-y-8">
          <div className="text-center mb-10">
            <h2 className="text-3xl font-black text-slate-800 mb-2">Módulos de Inventario</h2>
            <p className="text-slate-500">Selecciona la base de datos a la que deseas acceder. Cada módulo está especializado para un tipo específico de reactivo.</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
            {/* Oligos */}
            <a href="inventario_oligos.html" className="bg-white rounded-3xl p-6 border-2 border-transparent hover:border-emerald-400 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 group flex flex-col h-full relative overflow-hidden">
               <div className="absolute top-0 right-0 w-32 h-32 bg-emerald-100 rounded-bl-full -mr-8 -mt-8 z-0 transition-transform group-hover:scale-110"></div>
               <div className="relative z-10 flex flex-col h-full">
                 <div className="bg-emerald-50 w-16 h-16 rounded-2xl flex items-center justify-center mb-6 shadow-inner border border-emerald-100">
                   <Dna size={32} className="text-emerald-600"/>
                 </div>
                 <h3 className="text-2xl font-black text-slate-800 mb-2">Oligonucleótidos</h3>
                 <p className="text-sm text-slate-500 mb-6 flex-1">Gestión especializada de cebadores/primers. Secuencias, Tm, ubicación exacta y alertas de inespecificidad.</p>
                 <div className="flex items-center justify-between border-t border-slate-100 pt-4 mt-auto">
                   <span className="text-xs font-bold text-emerald-600 uppercase tracking-widest bg-emerald-50 px-3 py-1 rounded-full">{stats.oligosCount} Items</span>
                   <span className="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center group-hover:bg-emerald-600 transition-colors"><ArrowRight size={20}/></span>
                 </div>
               </div>
            </a>

            {/* Anticuerpos */}
            <a href="inventario_anticuerpos.html" className="bg-white rounded-3xl p-6 border-2 border-transparent hover:border-indigo-400 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 group flex flex-col h-full relative overflow-hidden">
               <div className="absolute top-0 right-0 w-32 h-32 bg-indigo-100 rounded-bl-full -mr-8 -mt-8 z-0 transition-transform group-hover:scale-110"></div>
               <div className="relative z-10 flex flex-col h-full">
                 <div className="bg-indigo-50 w-16 h-16 rounded-2xl flex items-center justify-center mb-6 shadow-inner border border-indigo-100">
                   <Beaker size={32} className="text-indigo-600"/>
                 </div>
                 <h3 className="text-2xl font-black text-slate-800 mb-2">Anticuerpos</h3>
                 <p className="text-sm text-slate-500 mb-6 flex-1">Inventario para Western Blot e IHQ. Control de especificidad, hospedero, diluciones y alertas manuales.</p>
                 <div className="flex items-center justify-between border-t border-slate-100 pt-4 mt-auto">
                   <span className="text-xs font-bold text-indigo-600 uppercase tracking-widest bg-indigo-50 px-3 py-1 rounded-full">{stats.abCount} Items</span>
                   <span className="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center group-hover:bg-indigo-600 transition-colors"><ArrowRight size={20}/></span>
                 </div>
               </div>
            </a>

            {/* Reactivos */}
            <a href="reactivos.html" className="bg-white rounded-3xl p-6 border-2 border-transparent hover:border-cyan-400 hover:shadow-2xl hover:-translate-y-2 transition-all duration-300 group flex flex-col h-full relative overflow-hidden">
               <div className="absolute top-0 right-0 w-32 h-32 bg-cyan-100 rounded-bl-full -mr-8 -mt-8 z-0 transition-transform group-hover:scale-110"></div>
               <div className="relative z-10 flex flex-col h-full">
                 <div className="bg-cyan-50 w-16 h-16 rounded-2xl flex items-center justify-center mb-6 shadow-inner border border-cyan-100">
                   <FlaskConical size={32} className="text-cyan-600"/>
                 </div>
                 <h3 className="text-2xl font-black text-slate-800 mb-2">Reactivos Generales</h3>
                 <p className="text-sm text-slate-500 mb-6 flex-1">Gestión de reactivos, soluciones, kits de extracción y consumibles generales del laboratorio.</p>
                 <div className="flex items-center justify-between border-t border-slate-100 pt-4 mt-auto">
                   <span className="text-xs font-bold text-cyan-600 uppercase tracking-widest bg-cyan-50 px-3 py-1 rounded-full">{stats.rxCount} Items</span>
                   <span className="w-10 h-10 rounded-full bg-slate-900 text-white flex items-center justify-center group-hover:bg-cyan-600 transition-colors"><ArrowRight size={20}/></span>
                 </div>
               </div>
            </a>
          </div>
        </div>
      );

      const renderScanner = () => (
        <div className="animate-fade-in max-w-2xl mx-auto text-center py-10">
           <div className="bg-white p-10 rounded-[3rem] shadow-xl border border-slate-100 relative overflow-hidden">
              <div className="absolute inset-0 bg-blue-50/50 flex items-center justify-center">
                 <div className="w-full h-full max-w-md max-h-96 border-4 border-blue-400/30 rounded-3xl relative">
                    <div className="absolute top-0 left-0 w-full h-1 bg-blue-500 shadow-[0_0_15px_#3b82f6] animate-[ping_2s_ease-in-out_infinite]"></div>
                    
                    <div className="absolute top-4 left-4 w-12 h-12 border-t-4 border-l-4 border-blue-500 rounded-tl-xl"></div>
                    <div className="absolute top-4 right-4 w-12 h-12 border-t-4 border-r-4 border-blue-500 rounded-tr-xl"></div>
                    <div className="absolute bottom-4 left-4 w-12 h-12 border-b-4 border-l-4 border-blue-500 rounded-bl-xl"></div>
                    <div className="absolute bottom-4 right-4 w-12 h-12 border-b-4 border-r-4 border-blue-500 rounded-br-xl"></div>
                 </div>
              </div>
              
              <div className="relative z-10 bg-white/80 backdrop-blur-md p-8 rounded-3xl mt-20 inline-block border border-slate-200">
                <ScanLine size={64} className="text-blue-600 mx-auto mb-4" />
                <h2 className="text-2xl font-black text-slate-800 mb-2">Escáner de Códigos</h2>
                <p className="text-slate-500 text-sm max-w-xs mx-auto mb-6">Apunta la cámara al código de barras o QR de la etiqueta para ver la ficha del producto.</p>
                
                <button className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-all w-full">
                  Activar Cámara
                </button>
              </div>
           </div>
        </div>
      );

      return (
        <div className="flex h-screen overflow-hidden bg-slate-50">
          
          {/* Sidebar Desktop */}
          <aside className="hidden md:flex flex-col w-72 glass-sidebar text-white transition-all duration-300 shadow-2xl relative z-20">
            <div className="p-6 flex items-center gap-3 border-b border-white/10">
              <div className="bg-gradient-to-br from-blue-500 to-cyan-500 w-10 h-10 rounded-xl flex items-center justify-center shadow-lg">
                <Boxes className="text-white" size={20} />
              </div>
              <div>
                <h1 className="font-black text-xl tracking-tight">LabManager</h1>
                <span className="text-[10px] uppercase font-bold text-blue-400 tracking-widest">Edición Pro</span>
              </div>
            </div>

            <nav className="flex-1 p-4 space-y-2 mt-4 overflow-y-auto no-scrollbar">
              <button onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-white/10 hover:text-white'}`}>
                <LayoutDashboard size={20}/> Panel Principal
              </button>
              
              <div className="pt-4 pb-2 px-4">
                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Módulos</p>
              </div>

              <button onClick={() => setActiveTab('inventory')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium ${activeTab === 'inventory' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-white/10 hover:text-white'}`}>
                <FolderOpen size={20}/> Bases de Datos
              </button>
              
              {/* Enlaces directos en el sidebar */}
              <div className="pl-11 space-y-1 mt-1">
                 <a href="inventario_oligos.html" className="block py-2 text-sm text-slate-400 hover:text-emerald-400 transition-colors flex items-center gap-2"><Dna size={14}/> Oligos</a>
                 <a href="inventario_anticuerpos.html" className="block py-2 text-sm text-slate-400 hover:text-indigo-400 transition-colors flex items-center gap-2"><Beaker size={14}/> Anticuerpos</a>
                 <a href="reactivos.html" className="block py-2 text-sm text-slate-400 hover:text-cyan-400 transition-colors flex items-center gap-2"><FlaskConical size={14}/> Reactivos Generales</a>
              </div>

              <div className="pt-4 pb-2 px-4">
                <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Herramientas</p>
              </div>

              <button onClick={() => setActiveTab('scanner')} className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all font-medium ${activeTab === 'scanner' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:bg-white/10 hover:text-white'}`}>
                <ScanLine size={20}/> Escanear Etiqueta
              </button>
            </nav>

            <div className="p-4 border-t border-white/10 bg-slate-900/50">
              <div className="flex items-center gap-3 mb-4 px-2">
                <div className="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center overflow-hidden border-2 border-slate-600">
                  {user?.photoURL ? <img src={user.photoURL} alt="perfil"/> : <User className="text-slate-400" size={20}/>}
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-bold truncate text-white">{user?.name}</p>
                  <p className="text-[10px] text-slate-400 truncate">{user?.isSuperAdmin ? 'Administrador' : 'Usuario Estandar'}</p>
                </div>
              </div>
              <button onClick={handleLogout} className="w-full flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-sm font-bold text-red-400 hover:bg-red-500/10 hover:text-red-300 transition-all border border-transparent hover:border-red-500/30">
                <LogOut size={16}/> Cerrar Sesión
              </button>
            </div>
          </aside>

          {/* Main Content Area */}
          <main className="flex-1 flex flex-col h-full overflow-hidden relative z-10">
            
            {/* Topbar Desktop & Mobile Header */}
            <header className="bg-white shadow-sm px-6 py-4 flex items-center justify-between z-10">
               {/* Mobile Logo & Menu Toggle */}
               <div className="md:hidden flex items-center gap-3">
                 <div className="bg-blue-600 w-8 h-8 rounded-lg flex items-center justify-center shadow-md">
                   <Boxes className="text-white" size={16} />
                 </div>
                 <span className="font-black text-lg text-slate-800">LabManager</span>
               </div>

               {/* Desktop Page Title (Hidden on Mobile) */}
               <div className="hidden md:block">
                  <h2 className="text-xl font-black text-slate-800 capitalize">
                    {activeTab === 'dashboard' ? 'Panel Principal' : activeTab === 'inventory' ? 'Inventarios' : 'Escáner QR'}
                  </h2>
               </div>

               {/* User Actions */}
               <div className="flex items-center gap-4">
                  <button className="p-2 text-slate-400 hover:text-blue-600 hover:bg-blue-50 rounded-full transition-all relative">
                    <Bell size={20}/>
                    <span className="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                  </button>
                  {/* Avatar Solo Mobile */}
                  <div className="md:hidden w-8 h-8 rounded-full bg-slate-200 overflow-hidden border border-slate-300 flex items-center justify-center cursor-pointer" onClick={handleLogout}>
                     {user?.photoURL ? <img src={user.photoURL} alt="perfil"/> : <User className="text-slate-500" size={16}/>}
                  </div>
               </div>
            </header>

            {/* Content Scrollable Area */}
            <div className="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50/50 relative">
               
               {/* Decoración de fondo */}
               <div className="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-blue-50/50 to-transparent pointer-events-none -z-10"></div>

               <div className="max-w-7xl mx-auto pb-24 md:pb-10">
                 {activeTab === 'dashboard' && renderDashboard()}
                 {activeTab === 'inventory' && renderInventory()}
                 {activeTab === 'scanner' && renderScanner()}
               </div>
            </div>
          </main>

          {/* Bottom Navigation Mobile */}
          <nav className="md:hidden fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-slate-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-50 flex justify-around items-center p-2 pb-safe">
            <button onClick={() => setActiveTab('dashboard')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}`}>
              <LayoutDashboard size={24} className={activeTab === 'dashboard' ? 'mb-1' : ''}/>
              <span className={`text-[10px] font-bold ${activeTab === 'dashboard' ? 'opacity-100' : 'opacity-0 h-0'}`}>Inicio</span>
            </button>
            
            <button onClick={() => setActiveTab('inventory')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${activeTab === 'inventory' ? 'text-blue-600' : 'text-slate-400'}`}>
              <FolderOpen size={24} className={activeTab === 'inventory' ? 'mb-1' : ''}/>
              <span className={`text-[10px] font-bold ${activeTab === 'inventory' ? 'opacity-100' : 'opacity-0 h-0'}`}>Bases</span>
            </button>
            
            <button onClick={() => setActiveTab('scanner')} className={`relative -top-5 bg-blue-600 text-white p-4 rounded-full shadow-lg shadow-blue-500/40 border-4 border-slate-50 ${activeTab === 'scanner' ? 'scale-110' : ''} transition-transform`}>
              <ScanLine size={24}/>
            </button>
            
            <button onClick={() => {}} className="flex flex-col items-center p-2 rounded-xl transition-all text-slate-400 opacity-50 cursor-not-allowed">
              <Settings size={24}/>
            </button>
          </nav>

        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<MainApp />);
  </script>
</body>
</html>
