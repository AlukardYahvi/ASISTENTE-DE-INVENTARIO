<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario General: Reactivos y Materiales (Biologia Molecular)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    import * as LucideIcons from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';

    const { 
      Search, Settings, Trash2, ArrowLeft, Image: ImageIcon, ExternalLink, ShieldAlert, 
      Layers, X, Printer, History, MapPin, MinusCircle, FileText, Activity, Clock, User, Pencil, Tag, Calendar, AlertCircle, AlertTriangle, FlaskConical, Package, Droplet
    } = LucideIcons;

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDeaQnmO8nRG4stRrbnmONaz_k1EUWqVHc",
      authDomain: "asistente-de-inventario.firebaseapp.com",
      projectId: "asistente-de-inventario",
      storageBucket: "asistente-de-inventario.firebasestorage.app",
      messagingSenderId: "972615078649",
      appId: "1:972615078649:web:a803b9bd801a2481688828"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'lab-manager-yahvi';

    const SUPER_ADMIN_EMAILS = [
      'yahvi.edsel.hernandez@gmail.com',
      'asistentelicam@gmail.com',
      'nnajerag@ipn.mx',
      'cgomezm310393@gmail.com',
      'alymico53@gmail.com'
    ];

    function ReactivosApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [reactivos, setReactivos] = useState([]);
      const [logs, setLogs] = useState([]); 
      const [searchQuery, setSearchQuery] = useState('');
      const [loading, setLoading] = useState(true);

      const [view, setView] = useState('catalog'); 
      const [selectedItemDetail, setSelectedItemDetail] = useState(null); 

      const [showForm, setShowForm] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [imagePreview, setImagePreview] = useState(null);
      
      const [consumeItem, setConsumeItem] = useState(null);

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            }
          } catch (err) { console.error(err); }
        };
        initAuth();

        const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
          if (user) {
            setCurrentUser({ uid: user.uid, email: user.email, isSuperAdmin: user.email ? SUPER_ADMIN_EMAILS.includes(user.email) : false });
          } else { 
            setCurrentUser(null);
            setLoading(false);
          }
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!currentUser) return;

        const invRef = collection(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos');
        const unsubInv = onSnapshot(invRef, 
          (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setReactivos(data);
            
            if (selectedItemDetail) {
               const updatedItem = data.find(i => i.id === selectedItemDetail.id);
               if (updatedItem) setSelectedItemDetail(updatedItem);
               else setView('catalog'); 
            }
            setLoading(false);
          },
          (error) => { console.error("Error al escuchar cambios: ", error); setLoading(false); }
        );

        const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos_logs');
        const unsubLogs = onSnapshot(logsRef, 
          (snapshot) => {
            setLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
          },
          (error) => { console.error("Error al escuchar logs: ", error); }
        );

        return () => { unsubInv(); unsubLogs(); };
      }, [currentUser, selectedItemDetail]);

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX = 400; let w = img.width; let h = img.height;
            if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            setImagePreview(canvas.toDataURL('image/jpeg', 0.6));
          }
          img.src = event.target.result;
        }
        reader.readAsDataURL(file);
      };

      const logAction = async (itemId, itemName, action, details, amountTaken = 0, unit = '') => {
        try {
          const logId = `log_${Date.now()}_${Math.floor(Math.random()*1000)}`;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos_logs', logId), {
            itemId,
            itemName,
            action,
            details,
            amountTaken,
            unit,
            userEmail: currentUser.email,
            timestamp: new Date().toISOString()
          });
        } catch (e) { console.error("Error guardando log:", e); }
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!currentUser || !currentUser.isSuperAdmin) return alert("Solo los administradores autorizados pueden añadir elementos.");
        
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        data.qty = parseFloat(data.qty); 
        data.imageUrl = imagePreview || editingItem?.imageUrl || '';

        if (!data.barcode) {
            data.barcode = `LAB-RX-${Date.now().toString(36).toUpperCase()}`;
        }

        const isNew = !editingItem;
        const docId = editingItem ? editingItem.id : `rx_${Date.now()}`;
        
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', docId), data, { merge: true });
          
          await logAction(
            docId, 
            data.name, 
            isNew ? 'creado' : 'modificado', 
            isNew ? 'Registro inicial en el sistema' : 'Actualización de datos del elemento',
            0,
            data.unit
          );

          setShowForm(false); setEditingItem(null); setImagePreview(null);
        } catch (err) { alert("Error al guardar: " + err.message); }
      };

      const updateStockStatus = async (itemId, status) => {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', itemId), { stockStatus: status }, { merge: true });
        } catch (err) { console.error("Error al actualizar el estado: ", err); }
      };

      const updateQuickNotes = async (itemId, notes) => {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', itemId), { quickNotes: notes }, { merge: true });
        } catch (err) { console.error("Error al guardar la nota: ", err); }
      };

      const toggleWarningStatus = async (itemId, currentStatus) => {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', itemId), { hasWarning: !currentStatus }, { merge: true });
        } catch (err) { console.error("Error al actualizar la alerta: ", err); }
      };

      const updateWarningNotes = async (itemId, notes) => {
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', itemId), { warningNotes: notes }, { merge: true });
        } catch (err) { console.error("Error al guardar la nota de alerta: ", err); }
      };

      const handleConsumeSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const amountToTake = parseFloat(formData.get('amount'));
        const reason = formData.get('reason');

        if (amountToTake <= 0) return alert("Ingresa una cantidad válida.");
        if (amountToTake > consumeItem.qty) return alert("No hay suficiente stock en inventario.");

        const newQty = consumeItem.qty - amountToTake;

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', consumeItem.id), { qty: newQty }, { merge: true });
          
          await logAction(
            consumeItem.id,
            consumeItem.name,
            'consumido',
            reason,
            amountToTake,
            consumeItem.unit
          );

          setConsumeItem(null);
        } catch (err) { alert("Error al registrar el uso: " + err.message); }
      };

      const handleDelete = async (id, name) => {
        if (!currentUser?.isSuperAdmin) return;
        if (window.confirm(`¿Seguro que deseas eliminar el elemento "${name}" permanentemente?`)) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_reactivos', id));
          if(view === 'detail') setView('catalog'); 
        }
      };

      const handlePrintAllLabels = () => {
        const printWindow = window.open('', '_blank');
        if (reactivos.length === 0) return alert("No hay elementos para imprimir.");

        let labelsHtml = reactivos.map(item => {
          const code = item.barcode || item.id;
          const title = item.name;
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(code)}`;
          const barcodeUrl = `https://bwipjs-api.metafloor.com/?bcid=code128&text=${encodeURIComponent(code)}&scaleX=2&scaleY=1&includetext=true`;
          
          return `
            <div class="label-box">
              <div class="title">${title} <br/><span style="font-weight:normal; font-size:9px;">(${item.category || 'Reactivo'})</span></div>
              <div class="codes">
                 <img src="${qrUrl}" alt="QR" class="qr" />
                 <img src="${barcodeUrl}" alt="Barcode" class="barcode" />
              </div>
              <div class="meta"><strong>Lote:</strong> ${item.lotNum || '--'} | <strong>Caja:</strong> ${item.locationBox || '--'}</div>
            </div>
          `;
        }).join('');

        printWindow.document.write(`
          <html><head><title>Catálogo de Reactivos y Materiales</title><style>
            body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff;}
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7cm, 1fr)); gap: 15px; }
            .label-box { border: 1px dashed #666; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; border-radius: 4px;}
            .title { font-size: 11px; font-weight: bold; margin-bottom: 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .codes { display: flex; gap: 10px; align-items: center; justify-content: center; width: 100%;}
            .qr { width: 50px; height: 50px; }
            .barcode { height: 40px; max-width: 120px; object-fit: contain; }
            .meta { font-size: 10px; color: #333; margin-top: 8px; border-top: 1px solid #eee; padding-top: 4px; width: 100%;}
            @media print { body { padding: 0; } .label-box { page-break-inside: avoid; border: 1px solid #000; } }
          </style></head><body>
            <h2 style="text-align:center; margin-bottom: 20px;">Catálogo General de Etiquetas (Reactivos y Materiales)</h2>
            <div class="grid">${labelsHtml}</div>
            <script>setTimeout(() => { window.print(); }, 2000); <\/script>
          </body></html>
        `);
        printWindow.document.close();
      };

      const formatDate = (isoString) => {
        const d = new Date(isoString);
        return d.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      };

      const openDetailView = (item) => {
        setSelectedItemDetail(item);
        setView('detail');
      };

      const filteredItems = reactivos.filter(item => {
        const search = searchQuery.toLowerCase();
        return (
          item.name?.toLowerCase().includes(search) ||
          item.category?.toLowerCase().includes(search) ||
          item.technicalDetails?.toLowerCase().includes(search) ||
          item.locationBox?.toLowerCase().includes(search) ||
          item.brand?.toLowerCase().includes(search)
        );
      });

      if (loading) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-cyan-600"></div></div>;

      if (!currentUser) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
            <div className="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
              <ShieldAlert className="mx-auto text-orange-500 mb-4" size={48} />
              <h2 className="text-xl font-bold mb-2">Acceso Restringido</h2>
              <p className="text-gray-600 mb-6">Debes iniciar sesión en la aplicación principal (LabManager) para acceder a este módulo.</p>
              <a href="index.html" className="block w-full py-3 bg-cyan-600 text-white font-bold rounded-xl hover:bg-cyan-700">Ir a LabManager</a>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen pb-12 bg-slate-50 relative">
          
          {/* Header */}
          <div className="bg-gradient-to-r from-cyan-800 via-blue-800 to-cyan-900 pb-24 pt-8 px-4 md:px-8 shadow-lg">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-4 text-white">
                <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-sm"><FlaskConical size={32} /></div>
                <div>
                  <h1 className="text-3xl font-black tracking-tight">Reactivos y Materiales</h1>
                  <p className="text-cyan-200 font-medium text-sm mt-1">Módulo General LabManager</p>
                </div>
              </div>
              <div className="flex items-center gap-3 w-full md:w-auto">
                <a href="index.html" className="px-4 py-2 bg-white/10 text-white rounded-xl hover:bg-white/20 transition-colors font-bold flex items-center gap-2 backdrop-blur-sm"><ArrowLeft size={18}/> Dashboard</a>
                {currentUser.isSuperAdmin && view === 'catalog' && (
                  <button onClick={() => {setEditingItem(null); setImagePreview(null); setShowForm(true);}} className="flex-1 md:flex-none px-6 py-2 bg-white text-cyan-800 rounded-xl font-bold hover:bg-cyan-50 shadow-xl transition-all">
                    + Registrar Nuevo
                  </button>
                )}
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 md:px-8 -mt-16">
            
            {/* --- VISTA 1: CATÁLOGO --- */}
            {view === 'catalog' && (
              <div className="animate-fade-in">
                {/* Buscador */}
                <div className="bg-white rounded-2xl shadow-md p-4 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border border-gray-100">
                  <div className="flex items-center gap-2 bg-slate-100 p-3 rounded-xl flex-1 w-full focus-within:ring-2 ring-cyan-500 transition-all">
                    <Search className="text-cyan-500 mx-2" size={20} />
                    <input 
                      type="text" 
                      placeholder="Buscar por Nombre, Categoría, Especificaciones, Caja o Marca..." 
                      className="w-full bg-transparent outline-none font-medium text-gray-700" 
                      value={searchQuery} 
                      onChange={(e) => setSearchQuery(e.target.value)} 
                    />
                  </div>
                  {currentUser.isSuperAdmin && (
                    <button onClick={handlePrintAllLabels} className="px-5 py-3 bg-slate-800 text-white rounded-xl hover:bg-slate-900 font-bold flex items-center gap-2 shadow-sm w-full md:w-auto justify-center transition-colors">
                      <Printer size={18}/> Imprimir Catálogo
                    </button>
                  )}
                </div>

                {/* Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {filteredItems.length === 0 ? (
                    <div className="col-span-full text-center py-20 bg-white rounded-2xl border border-dashed border-gray-300">
                      <Package className="mx-auto text-gray-300 mb-4" size={64} />
                      <h3 className="text-xl font-bold text-gray-500">No se encontraron elementos</h3>
                      <p className="text-gray-400 mt-2">Intenta con otros términos de búsqueda o registra un reactivo nuevo.</p>
                    </div>
                  ) : (
                    filteredItems.map(item => (
                      <div key={item.id} onClick={() => openDetailView(item)} className="bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-xl hover:-translate-y-1 hover:border-cyan-400 transition-all duration-300 flex flex-col overflow-hidden group relative cursor-pointer">
                        
                        {/* Indicador de semáforo en catálogo */}
                        <div className="absolute top-3 left-3 z-20 flex gap-2">
                          {item.stockStatus === 'red' && <div className="w-3 h-3 rounded-full bg-red-500 shadow-sm border border-white" title="Nivel crítico"></div>}
                          {item.stockStatus === 'yellow' && <div className="w-3 h-3 rounded-full bg-yellow-500 shadow-sm border border-white" title="Nivel bajo"></div>}
                          {item.stockStatus === 'green' && <div className="w-3 h-3 rounded-full bg-green-500 shadow-sm border border-white" title="Nivel óptimo"></div>}
                        </div>

                        {/* Indicador de Alerta de Contaminación/Incidencia */}
                        {item.hasWarning && (
                          <div className="absolute top-3 right-3 z-20 animate-pulse">
                             <div className="bg-red-500 text-white px-2 py-1 rounded-md text-[10px] font-black uppercase flex items-center gap-1 shadow-md border border-red-600" title="Incidencia Reportada">
                               <AlertTriangle size={12} /> Alerta
                             </div>
                          </div>
                        )}

                        <div className="h-36 bg-cyan-50 flex items-center justify-center relative overflow-hidden border-b border-cyan-100 p-4">
                          {item.imageUrl ? (
                            <img src={item.imageUrl} alt={item.name} className="h-full object-contain mix-blend-multiply drop-shadow-sm group-hover:scale-105 transition-transform duration-500" />
                          ) : (
                            <div className="text-cyan-200 group-hover:text-cyan-300 transition-colors">
                              <FlaskConical size={56} />
                            </div>
                          )}
                        </div>

                        <div className="p-5 flex-1 flex flex-col">
                          <div className="mb-2">
                            <span className="inline-block px-2 py-0.5 bg-blue-100 text-blue-700 text-[10px] font-black rounded-md uppercase tracking-widest border border-blue-200 mb-2">
                              {item.category || 'General'}
                            </span>
                            <h3 className="font-black text-gray-800 text-lg leading-tight line-clamp-2" title={item.name}>{item.name}</h3>
                          </div>
                          
                          <div className="space-y-2 text-xs text-gray-600 mb-4 flex-1 mt-2">
                            <p className="flex justify-between border-b border-slate-50 pb-1"><span className="font-bold text-slate-400">Marca</span> <span className="font-medium text-slate-700 truncate ml-2" title={item.brand}>{item.brand || '--'}</span></p>
                            <p className="flex justify-between border-b border-slate-50 pb-1"><span className="font-bold text-slate-400">Detalles</span> <span className="font-medium text-slate-700 truncate ml-2" title={item.technicalDetails}>{item.technicalDetails || '--'}</span></p>
                            
                            <div className="mt-3 bg-cyan-50/50 p-2 rounded-lg border border-cyan-100/50">
                              <p className="text-[10px] uppercase font-bold text-cyan-600 flex items-center gap-1 mb-1"><MapPin size={12}/> Ubicación</p>
                              <p className="font-medium text-cyan-900 truncate" title={item.locationLab}>{item.locationLab || 'No especificado'}</p>
                              <p className="font-bold text-cyan-700">{item.locationBox || '--'}</p>
                            </div>
                          </div>

                          <div className="flex items-end justify-between pt-4 border-t border-slate-100 mt-2">
                            <div>
                              <p className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Disponible</p>
                              <p className="text-2xl font-black text-blue-600">{item.qty} <span className="text-xs font-bold text-slate-500">{item.unit}</span></p>
                            </div>
                            
                            {currentUser && (
                              <div className="flex gap-1.5 bg-slate-50 p-1.5 rounded-xl border border-slate-100">
                                <button onClick={(e) => { e.stopPropagation(); setConsumeItem(item); }} className="p-2 bg-blue-100 text-blue-700 rounded-lg hover:bg-blue-600 hover:text-white transition-colors shadow-sm" title="Descontar/Usar">
                                  <MinusCircle size={18}/>
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            )}

            {/* --- VISTA 2: DETALLE DEL ARTÍCULO --- */}
            {view === 'detail' && selectedItemDetail && (
              <div className="animate-fade-in pb-10">
                <button onClick={() => setView('catalog')} className="mb-6 px-4 py-2 bg-white text-cyan-700 font-bold rounded-xl shadow-sm border border-cyan-100 hover:bg-cyan-50 flex items-center gap-2 transition-colors">
                  <ArrowLeft size={18}/> Volver al Catálogo
                </button>

                <div className="bg-white rounded-[2rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col lg:flex-row">
                  {/* Lado Izquierdo: Imagen e Info Básica */}
                  <div className="lg:w-1/3 bg-slate-50 border-r border-slate-100 p-8 flex flex-col items-center">
                    <div className="bg-white w-full aspect-square rounded-2xl shadow-inner border-2 border-dashed border-slate-200 flex items-center justify-center p-4 mb-6 relative group overflow-hidden">
                      {selectedItemDetail.imageUrl ? (
                        <img src={selectedItemDetail.imageUrl} alt={selectedItemDetail.name} className="max-w-full max-h-full object-contain" />
                      ) : (
                        <Package size={80} className="text-slate-300"/>
                      )}
                    </div>
                    
                    <div className="w-full text-center mb-6">
                      <p className="text-blue-500 font-black uppercase tracking-widest text-xs mb-2 bg-blue-50 inline-block px-3 py-1 rounded-full border border-blue-100">{selectedItemDetail.category || 'Reactivo General'}</p>
                      <h2 className="text-3xl font-black text-slate-800 leading-tight">{selectedItemDetail.name}</h2>
                    </div>

                    <div className="w-full bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                      <div className="flex justify-between items-center border-b border-slate-50 pb-2">
                        <span className="text-xs font-bold text-slate-400 flex items-center gap-1"><Tag size={14}/> ID Catálogo</span>
                        <span className="font-mono text-sm text-slate-700 font-bold">{selectedItemDetail.catalogNum || '--'}</span>
                      </div>
                      <div className="flex justify-between items-center border-b border-slate-50 pb-2">
                        <span className="text-xs font-bold text-slate-400 flex items-center gap-1"><Layers size={14}/> LAB Barcode</span>
                        <span className="font-mono text-xs bg-slate-100 px-2 py-1 rounded text-slate-600">{selectedItemDetail.barcode}</span>
                      </div>
                      <div className="flex justify-between items-center pb-2">
                        <span className="text-xs font-bold text-slate-400 flex items-center gap-1"><Calendar size={14}/> Caducidad</span>
                        <span className={`font-bold ${selectedItemDetail.expirationDate && new Date(selectedItemDetail.expirationDate) < new Date() ? 'text-red-500' : 'text-slate-700'}`}>
                          {selectedItemDetail.expirationDate || 'N/A'}
                        </span>
                      </div>
                    </div>
                  </div>

                  {/* Lado Derecho: Detalles Completos */}
                  <div className="lg:w-2/3 p-8 flex flex-col">
                    
                    <div className="flex flex-wrap justify-between items-start gap-4 mb-6 border-b border-slate-100 pb-6">
                      <div>
                        <p className="text-xs uppercase font-bold tracking-widest text-slate-400 mb-1">Marca / Proveedor</p>
                        <h3 className="text-2xl font-black text-slate-800 mb-2">{selectedItemDetail.brand}</h3>
                        <p className="text-slate-500 font-medium text-sm">Lote: <span className="text-slate-700 font-mono">{selectedItemDetail.lotNum || '--'}</span></p>
                      </div>
                      
                      {currentUser && (
                        <div className="flex gap-2">
                          <button onClick={() => setConsumeItem(selectedItemDetail)} className="px-4 py-2 bg-blue-100 text-blue-700 font-bold rounded-xl hover:bg-blue-600 hover:text-white transition-colors shadow-sm flex items-center gap-2">
                            <MinusCircle size={18}/> Descontar
                          </button>
                          {currentUser.isSuperAdmin && (
                            <>
                              <button onClick={() => {setEditingItem(selectedItemDetail); setImagePreview(selectedItemDetail.imageUrl); setShowForm(true);}} className="px-4 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200 transition-colors shadow-sm flex items-center gap-2">
                                <Settings size={18}/> Editar
                              </button>
                              <button onClick={() => handleDelete(selectedItemDetail.id, selectedItemDetail.name)} className="p-2 bg-red-50 text-red-500 rounded-xl hover:bg-red-100 hover:text-red-600 transition-colors shadow-sm">
                                <Trash2 size={20}/>
                              </button>
                            </>
                          )}
                        </div>
                      )}
                    </div>

                    {/* Especificaciones Técnicas (Reemplazo de Secuencia/Hospedero) */}
                    {selectedItemDetail.technicalDetails && (
                      <div className="mb-6">
                         <p className="text-xs font-bold text-cyan-700 uppercase tracking-wider mb-2 flex items-center gap-1"><Droplet size={16}/> Características / Especificaciones Técnicas</p>
                         <div className="bg-cyan-50/50 p-4 rounded-xl border border-cyan-100 text-cyan-900 font-medium text-sm leading-relaxed">
                           {selectedItemDetail.technicalDetails}
                         </div>
                      </div>
                    )}

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                      <div className="bg-blue-50 p-6 rounded-2xl border border-blue-100">
                        <p className="text-xs uppercase font-bold tracking-widest text-blue-500 mb-2 flex items-center gap-2"><MapPin size={16}/> Localización Exacta</p>
                        <p className="font-medium text-blue-900 text-lg mb-1">{selectedItemDetail.locationLab || 'No definido'}</p>
                        <p className="font-black text-blue-700 text-xl">{selectedItemDetail.locationBox || '--'}</p>
                      </div>

                      <div className="bg-white p-6 rounded-2xl border border-slate-200 flex flex-col justify-center shadow-sm">
                        <p className="text-xs uppercase font-bold tracking-widest text-slate-500 mb-2 flex items-center gap-2"><Activity size={16}/> Inventario / Stock Físico</p>
                        <div className="flex items-baseline gap-2">
                          <p className="text-5xl font-black text-slate-800">{selectedItemDetail.qty}</p>
                          <p className="text-xl font-bold text-slate-500">{selectedItemDetail.unit}</p>
                        </div>
                      </div>
                    </div>

                    {/* SEMÁFORO Y NOTAS RÁPIDAS DE ESTADO */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center">
                        <h4 className="text-sm font-bold text-slate-700 mb-4 flex items-center gap-2">
                          <AlertCircle size={18} className="text-slate-400" /> Semáforo de Nivel Físico
                        </h4>
                        <div className="flex justify-around items-center px-4">
                          <button onClick={() => updateStockStatus(selectedItemDetail.id, 'green')} className={`w-12 h-12 rounded-full transition-all duration-300 ${selectedItemDetail.stockStatus === 'green' || !selectedItemDetail.stockStatus ? 'bg-green-500 shadow-[0_0_15px_rgba(34,197,94,0.6)] scale-110 border-2 border-white' : 'bg-green-100 hover:bg-green-200'}`} title="Nivel Óptimo"></button>
                          <button onClick={() => updateStockStatus(selectedItemDetail.id, 'yellow')} className={`w-12 h-12 rounded-full transition-all duration-300 ${selectedItemDetail.stockStatus === 'yellow' ? 'bg-yellow-500 shadow-[0_0_15px_rgba(234,179,8,0.6)] scale-110 border-2 border-white' : 'bg-yellow-100 hover:bg-yellow-200'}`} title="Nivel Medio/Bajo"></button>
                          <button onClick={() => updateStockStatus(selectedItemDetail.id, 'red')} className={`w-12 h-12 rounded-full transition-all duration-300 ${selectedItemDetail.stockStatus === 'red' ? 'bg-red-500 shadow-[0_0_15px_rgba(239,68,68,0.6)] scale-110 border-2 border-white' : 'bg-red-100 hover:bg-red-200'}`} title="Nivel Crítico/Vacío"></button>
                        </div>
                        <p className="text-center text-xs text-slate-400 mt-4 italic">Haz clic para actualizar el nivel visual de stock.</p>
                      </div>

                      <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
                        <h4 className="text-sm font-bold text-slate-700 mb-2 flex items-center gap-2">
                          <FileText size={18} className="text-slate-400" /> Notas de Stock
                        </h4>
                        <textarea 
                          defaultValue={selectedItemDetail.quickNotes || ''} 
                          onBlur={(e) => updateQuickNotes(selectedItemDetail.id, e.target.value)}
                          placeholder="Ej: Solo quedan 2 botellas selladas, hacer pedido urgente..." 
                          className="w-full flex-1 p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white outline-none resize-none text-sm text-slate-700 placeholder-slate-400"
                        ></textarea>
                        <p className="text-right text-[10px] text-slate-400 mt-1">Autoguardado al salir</p>
                      </div>
                    </div>

                    {/* ALERTA DE INCIDENCIA / CONTAMINACIÓN */}
                    <div className={`p-5 rounded-2xl border shadow-sm flex flex-col mb-8 transition-colors duration-300 ${selectedItemDetail.hasWarning ? 'bg-red-50 border-red-200' : 'bg-white border-slate-200'}`}>
                      <div className="flex justify-between items-center mb-2">
                        <h4 className={`text-sm font-bold flex items-center gap-2 ${selectedItemDetail.hasWarning ? 'text-red-700' : 'text-slate-700'}`}>
                          <AlertTriangle size={18} className={selectedItemDetail.hasWarning ? 'text-red-500' : 'text-slate-400'} /> 
                          Reportar Incidencia / Problema (Ej. Contaminación)
                        </h4>
                        <button 
                          onClick={() => toggleWarningStatus(selectedItemDetail.id, selectedItemDetail.hasWarning)}
                          className={`px-3 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-1 ${selectedItemDetail.hasWarning ? 'bg-red-600 text-white shadow-md hover:bg-red-700' : 'bg-slate-100 text-slate-500 hover:bg-slate-200'}`}
                        >
                          {selectedItemDetail.hasWarning ? 'Desactivar Alerta' : 'Activar Alerta'}
                        </button>
                      </div>
                      
                      {selectedItemDetail.hasWarning ? (
                        <div className="animate-fade-in mt-3 flex flex-col">
                          <textarea 
                            defaultValue={selectedItemDetail.warningNotes || ''} 
                            onBlur={(e) => updateWarningNotes(selectedItemDetail.id, e.target.value)}
                            placeholder="Describe el problema (ej. Sospecha de contaminación fúngica, solución precipitada, lote defectuoso...)" 
                            className="w-full flex-1 p-3 bg-white border border-red-200 rounded-xl focus:border-red-500 focus:ring-2 ring-red-100 outline-none resize-none text-sm text-red-900 placeholder-red-300"
                            rows="3"
                          ></textarea>
                          <p className="text-right text-[10px] text-red-400 mt-1 font-medium">El reporte se guarda al salir del cuadro</p>
                        </div>
                      ) : (
                        <p className="text-xs text-slate-400 mt-1">Activa esta alerta para advertir a los demás de que no usen este reactivo hasta revisión.</p>
                      )}
                    </div>

                    {selectedItemDetail.notes && (
                      <div className="mb-8">
                        <h4 className="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2"><FileText size={18}/> Notas de Almacenaje / Preparación</h4>
                        <div className="bg-yellow-50/50 p-4 rounded-xl border border-yellow-100 text-slate-700 leading-relaxed text-sm">
                          {selectedItemDetail.notes}
                        </div>
                      </div>
                    )}

                    {selectedItemDetail.purchaseLink && (
                      <a href={selectedItemDetail.purchaseLink} target="_blank" className="w-full sm:w-auto self-start px-6 py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900 transition-colors shadow-md flex items-center gap-2 mb-8">
                        <ExternalLink size={18}/> Enlace de Producto / Compra
                      </a>
                    )}

                    <div className="mt-auto pt-6 border-t border-slate-100">
                      <h4 className="text-lg font-black text-slate-800 mb-4 flex items-center gap-2"><History size={20} className="text-cyan-600"/> Historial de Uso</h4>
                      
                      {logs.filter(log => log.itemId === selectedItemDetail.id).length === 0 ? (
                        <p className="text-slate-400 text-sm italic">No hay registros aún.</p>
                      ) : (
                        <div className="space-y-3 max-h-64 overflow-y-auto pr-2">
                          {logs.filter(log => log.itemId === selectedItemDetail.id)
                            .sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp))
                            .map(log => (
                            <div key={log.id} className="bg-slate-50 p-4 rounded-xl border border-slate-100 flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                              <div>
                                <div className="flex items-center gap-2 mb-1">
                                  <span className={`text-[10px] font-black uppercase px-2 py-0.5 rounded-md ${log.action === 'consumido' ? 'bg-orange-100 text-orange-700' : log.action === 'creado' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>
                                    {log.action} {log.action === 'consumido' && `- ${log.amountTaken} ${log.unit || ''}`}
                                  </span>
                                  <span className="text-xs text-slate-400 flex items-center gap-1"><Clock size={12}/> {formatDate(log.timestamp)}</span>
                                </div>
                                <p className="text-sm font-medium text-slate-700">{log.details}</p>
                              </div>
                              <div className="text-xs font-bold text-slate-500 bg-white px-2 py-1 rounded border shadow-sm flex items-center gap-1 w-fit">
                                <User size={12}/> {log.userEmail.split('@')[0]}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                  </div>
                </div>
              </div>
            )}

            {/* --- MODAL DE CREACIÓN/EDICIÓN --- */}
            {}
            {showForm && currentUser.isSuperAdmin && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/50 backdrop-blur-sm">
                <div className="bg-white rounded-3xl shadow-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto animate-fade-in relative border border-cyan-100">
                  <div className="sticky top-0 bg-white/90 backdrop-blur-md px-6 py-4 border-b flex justify-between items-center z-10">
                    <h2 className="text-xl font-black text-gray-800 flex items-center gap-2">
                      <FlaskConical className="text-cyan-600"/> {editingItem ? 'Editar Registro' : 'Registrar Nuevo Elemento'}
                    </h2>
                    <button onClick={() => {setShowForm(false); setImagePreview(null); setEditingItem(null);}} className="p-2 bg-gray-100 text-gray-600 hover:bg-gray-200 rounded-full transition-colors"><X size={20}/></button>
                  </div>
                  
                  <form onSubmit={handleSave} className="p-6 space-y-6">
                    <div className="flex flex-col md:flex-row gap-6">
                      {/* Foto */}
                      <div className="w-full md:w-1/3 space-y-2">
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wider">Foto del Envase/Producto</label>
                        <div className="h-56 w-full bg-slate-50 border-2 border-dashed border-cyan-200 rounded-2xl flex items-center justify-center overflow-hidden relative hover:bg-cyan-50 transition-colors group">
                          {imagePreview || (editingItem && editingItem.imageUrl) ? <img src={imagePreview || editingItem.imageUrl} className="object-cover w-full h-full" /> : 
                            <div className="text-center text-cyan-400 group-hover:text-cyan-600 transition-colors">
                              <ImageIcon className="mx-auto mb-2" size={40}/>
                              <span className="text-sm font-medium">Click para subir</span>
                            </div>
                          }
                          <input type="file" accept="image/*" onChange={handleImageUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
                        </div>
                      </div>
                      
                      {/* Datos Libres */}
                      <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-blue-600 uppercase mb-1 tracking-wider">Nombre del Reactivo/Material *</label>
                          <input name="name" placeholder="ej. Agua DEPC, SYBR Green, Puntas 10ul..." defaultValue={editingItem?.name} required className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white focus:ring-2 ring-cyan-100 outline-none transition-all font-bold text-lg text-gray-800" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Categoría / Tipo *</label>
                          <input name="category" placeholder="ej. Solución, Material, Reactivo PCR..." defaultValue={editingItem?.category} required className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white outline-none transition-all" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Marca / Proveedor *</label>
                          <input name="brand" placeholder="ej. Invitrogen, Eppendorf..." defaultValue={editingItem?.brand} required className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white outline-none transition-all" />
                        </div>
                        <div className="sm:col-span-2">
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Detalles / Especificaciones Técnicas</label>
                          <input name="technicalDetails" placeholder="ej. 10X, 500mM, Libre de RNasas, Para PCR Tiempo Real..." defaultValue={editingItem?.technicalDetails} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white outline-none transition-all" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Nº de Catálogo</label>
                          <input name="catalogNum" defaultValue={editingItem?.catalogNum} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white outline-none font-mono" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Nº de Lote</label>
                          <input name="lotNum" defaultValue={editingItem?.lotNum} className="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl focus:border-cyan-500 focus:bg-white outline-none font-mono" />
                        </div>
                      </div>
                    </div>

                    <div className="border-t border-slate-100 pt-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                      {/* Ubicación */}
                      <div className="bg-slate-50 p-4 rounded-2xl border border-slate-100 space-y-4">
                        <h3 className="font-bold text-slate-700 flex items-center gap-2"><MapPin size={18} className="text-cyan-500"/> Ubicación Física</h3>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Laboratorio / Cuarto *</label>
                          <input name="locationLab" placeholder="ej. Cuarto de Cultivo, Gaveta General..." defaultValue={editingItem?.locationLab} required className="w-full p-3 border border-slate-200 rounded-xl focus:border-cyan-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Lugar Específico (Refri/Estante) *</label>
                          <input name="locationBox" placeholder="ej. Estante 2, Refri 4 Puerta..." defaultValue={editingItem?.locationBox} required className="w-full p-3 border border-slate-200 rounded-xl focus:border-cyan-500 outline-none" />
                        </div>
                      </div>

                      {/* Cantidad y Fechas */}
                      <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                          <div>
                            <label className="block text-xs font-bold text-blue-600 uppercase mb-1 tracking-wider">Cantidad Disponible *</label>
                            <input type="number" step="0.01" min="0" name="qty" defaultValue={editingItem?.qty || 1} required className="w-full p-3 border border-slate-200 rounded-xl text-center font-bold text-blue-700 focus:border-blue-500 outline-none bg-blue-50" />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Unidad *</label>
                            <input name="unit" placeholder="ej. mL, mg, Cajas, Rxns" defaultValue={editingItem?.unit || 'mL'} required className="w-full p-3 border border-slate-200 rounded-xl text-center outline-none" />
                          </div>
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-orange-500 uppercase mb-1 tracking-wider">Caducidad (Opcional)</label>
                          <input type="date" name="expirationDate" defaultValue={editingItem?.expirationDate} className="w-full p-3 border border-slate-200 rounded-xl focus:border-cyan-500 outline-none" />
                        </div>
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider">Enlace de Compra/Ficha</label>
                          <input name="purchaseLink" defaultValue={editingItem?.purchaseLink} type="url" placeholder="https://..." className="w-full p-3 border border-slate-200 rounded-xl outline-none" />
                        </div>
                      </div>
                    </div>

                    <div className="border-t border-slate-100 pt-6">
                       <label className="block text-xs font-bold text-gray-500 uppercase mb-1 tracking-wider"><FileText size={14} className="inline mr-1"/>Notas de Almacenamiento / Preparación</label>
                       <textarea name="notes" defaultValue={editingItem?.notes} rows="2" placeholder="Ej. Sensible a la luz, guardar en oscuridad. Alícuotas en refri 4." className="w-full p-3 border border-slate-200 rounded-xl focus:border-cyan-500 outline-none resize-none"></textarea>
                    </div>

                    <div className="bg-slate-50 p-4 -mx-6 -mb-6 mt-6 rounded-b-3xl border-t">
                      <button type="submit" className="w-full py-4 bg-cyan-700 text-white font-black text-lg rounded-xl hover:bg-cyan-800 shadow-lg hover:shadow-cyan-500/30 transition-all">Guardar Elemento en Inventario</button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* --- MODAL DE CONSUMO --- */}
            {}
            {consumeItem && (
               <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md animate-fade-in overflow-hidden border border-blue-100">
                    <div className="bg-blue-700 p-6 text-white text-center">
                      <Activity className="mx-auto mb-2 opacity-80" size={40}/>
                      <h2 className="text-2xl font-black">Registrar Consumo</h2>
                      <p className="text-blue-100 font-medium">{consumeItem.name}</p>
                    </div>
                    <form onSubmit={handleConsumeSubmit} className="p-6 space-y-5">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center flex justify-between items-center">
                        <span className="text-sm font-bold text-gray-500 uppercase">Stock Físico Actual:</span>
                        <span className="text-2xl font-black text-blue-700">{consumeItem.qty} <span className="text-sm">{consumeItem.unit}</span></span>
                      </div>
                      
                      <div>
                        <label className="block text-xs font-bold text-gray-600 uppercase mb-2">Cantidad a Descontar ({consumeItem.unit}) *</label>
                        <input type="number" step="0.01" min="0.01" name="amount" required max={consumeItem.qty} className="w-full p-4 border border-slate-200 rounded-xl text-center text-xl font-bold focus:border-blue-500 focus:ring-2 ring-blue-200 outline-none" placeholder="0.0" />
                      </div>
                      
                      <div>
                         <label className="block text-xs font-bold text-gray-600 uppercase mb-2">Proyecto, Persona o Motivo *</label>
                         <textarea name="reason" required rows="2" className="w-full p-3 border border-slate-200 rounded-xl focus:border-blue-500 outline-none resize-none" placeholder="Ej. Preparación de geles, Tomado para Cuarto de Cultivo..."></textarea>
                      </div>

                      <div className="flex gap-3 pt-4">
                        <button type="button" onClick={() => setConsumeItem(null)} className="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">Cancelar</button>
                        <button type="submit" className="flex-1 py-3 bg-blue-700 text-white font-bold rounded-xl hover:bg-blue-800 shadow-md shadow-blue-500/20 transition-all">Confirmar Descuento</button>
                      </div>
                    </form>
                  </div>
               </div>
            )}
            
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<ReactivosApp />);
  </script>
</body>
</html>
