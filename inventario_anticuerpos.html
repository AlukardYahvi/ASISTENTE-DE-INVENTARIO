<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario Especializado: Anticuerpos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    .glass-effect { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
  </style>
</head>
<body class="bg-slate-50 text-gray-900 font-sans">
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useEffect } from 'https://esm.sh/react@18.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithCustomToken } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
    import * as LucideIcons from 'https://esm.sh/lucide-react@0.344.0?deps=react@18.2.0';

    const { 
      Search, Settings, Trash2, ArrowLeft, Image: ImageIcon, ExternalLink, ShieldAlert, 
      Beaker, X, Printer, History, MapPin, MinusCircle, FileText, Clock, User, Info, Calendar, Tag, Layers, 
      Upload, Camera, Download, AlertTriangle, Bell, Package, PackageOpen, Mail, Truck, Plus, CheckSquare
    } = LucideIcons;

    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      apiKey: "AIzaSyDeaQnmO8nRG4stRrbnmONaz_k1EUWqVHc",
      authDomain: "asistente-de-inventario.firebaseapp.com",
      projectId: "asistente-de-inventario",
      storageBucket: "asistente-de-inventario.firebasestorage.app",
      messagingSenderId: "972615078649",
      appId: "1:972615078649:web:a803b9bd801a2481688828"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'lab-manager-yahvi';

    const SUPER_ADMIN_EMAILS = [
      'yahvi.edsel.hernandez@gmail.com',
      'asistentelicam@gmail.com',
      'nnajerag@ipn.mx',
      'cgomezm310393@gmail.com',
      'avalentinaregab@gmail.com'
    ];

    function AnticuerposApp() {
      const [currentUser, setCurrentUser] = useState(null);
      const [anticuerpos, setAnticuerpos] = useState([]);
      const [abLogs, setAbLogs] = useState([]); 
      const [searchQuery, setSearchQuery] = useState('');
      const [loading, setLoading] = useState(true);

      const [view, setView] = useState('catalog'); 
      const [selectedItemDetail, setSelectedItemDetail] = useState(null); 

      const [showForm, setShowForm] = useState(false);
      const [editingItem, setEditingItem] = useState(null);
      const [imagePreviews, setImagePreviews] = useState([]);
      const [formSealStatus, setFormSealStatus] = useState('sealed');
      
      const [consumeItem, setConsumeItem] = useState(null); 
      const [showGlobalHistory, setShowGlobalHistory] = useState(false); 

      useEffect(() => {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            }
          } catch (err) { console.error(err); }
        };
        initAuth();

        const unsubscribeAuth = onAuthStateChanged(auth, (user) => {
          if (user) {
            const userEmail = user.email || '';
            const userName = user.displayName || (userEmail ? userEmail.split('@')[0] : 'Usuario Anónimo');
            const isSuperAdmin = userEmail ? SUPER_ADMIN_EMAILS.includes(userEmail) : false;
            setCurrentUser({ uid: user.uid, email: userEmail, name: userName, isSuperAdmin: isSuperAdmin });
          } else { 
            setCurrentUser(null);
            setLoading(false);
          }
        });
        return () => unsubscribeAuth();
      }, []);

      useEffect(() => {
        if (!currentUser) return;

        const invRef = collection(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos');
        const unsubInv = onSnapshot(invRef, (snapshot) => {
            const data = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            setAnticuerpos(data);
            if (selectedItemDetail) {
              const updatedItem = data.find(i => i.id === selectedItemDetail.id);
              if (updatedItem) setSelectedItemDetail(updatedItem);
              else setView('catalog');
            }
            setLoading(false);
          },
          (error) => { console.error("Error: ", error); setLoading(false); }
        );

        const logsRef = collection(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos_logs');
        const unsubLogs = onSnapshot(logsRef, (snapshot) => {
            setAbLogs(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => new Date(b.timestamp) - new Date(a.timestamp)));
          }
        );

        return () => { unsubInv(); unsubLogs(); };
      }, [currentUser, selectedItemDetail]);

      useEffect(() => {
        if (showForm && editingItem) {
          const loadedImages = editingItem.imageUrls ? [...editingItem.imageUrls] : (editingItem.imageUrl ? [editingItem.imageUrl] : []);
          setImagePreviews(loadedImages);
          setFormSealStatus(editingItem.sealStatus || 'sealed');
        } else if (!showForm) {
          setImagePreviews([]);
          setFormSealStatus('sealed');
        }
      }, [showForm, editingItem]);

      const handleImageUpload = (e) => {
        const files = Array.from(e.target.files);
        if (files.length === 0) return;
        if (imagePreviews.length + files.length > 4) return alert("Puedes subir un máximo de 4 fotografías.");

        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX = 600; let w = img.width; let h = img.height;
              if (w > h) { if (w > MAX) { h *= MAX / w; w = MAX; } } else { if (h > MAX) { w *= MAX / h; h = MAX; } }
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              setImagePreviews(prev => [...prev, canvas.toDataURL('image/jpeg', 0.7)].slice(0, 4));
            }
            img.src = event.target.result;
          }
          reader.readAsDataURL(file);
        });
      };

      const removeImagePreview = (index) => setImagePreviews(prev => prev.filter((_, i) => i !== index));

      const logAction = async (itemId, itemName, action, details, amountTaken = 0, unit = '') => {
        try {
          const logId = `log_${Date.now()}_${Math.floor(Math.random()*1000)}`;
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos_logs', logId), {
            itemId,
            itemName,
            action,
            details,
            amountTaken,
            unit,
            userEmail: currentUser?.email || 'anonimo@lab',
            userName: currentUser?.name || 'Usuario',
            timestamp: new Date().toISOString()
          });
        } catch (e) {
          console.error("Error guardando log:", e);
        }
      };

      const handleSave = async (e) => {
        e.preventDefault();
        if (!currentUser || !currentUser.isSuperAdmin) return alert("Solo administradores.");
        
        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        data.qty = Number(data.qty);
        data.imageUrls = imagePreviews;
        data.sealStatus = formSealStatus;
        if (!data.barcode) data.barcode = `LAB-AB-${Date.now().toString(36).toUpperCase()}`;

        if(editingItem && editingItem.manualAlert !== undefined) data.manualAlert = editingItem.manualAlert;
        else data.manualAlert = false;

        const isNew = !editingItem;
        const docId = editingItem ? editingItem.id : `ab_${Date.now()}`;
        
        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos', docId), data, { merge: true });
          await logAction(docId, data.target || data.name, isNew ? 'creado' : 'modificado', isNew ? 'Registro inicial' : 'Actualización de datos');
          setShowForm(false); setEditingItem(null); setImagePreviews([]);
        } catch (err) { alert("Error al guardar: " + err.message); }
      };

      const handleConsumeSubmit = async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const amountToTake = Number(formData.get('amount'));
        const reason = formData.get('reason');

        if (amountToTake <= 0 || amountToTake > consumeItem.qty) return alert("Cantidad inválida o superior al stock.");

        try {
          await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos', consumeItem.id), { qty: consumeItem.qty - amountToTake }, { merge: true });
          await logAction(consumeItem.id, consumeItem.target || consumeItem.name, 'consumido', reason, amountToTake, consumeItem.unit);
          setConsumeItem(null);
        } catch (err) { alert("Error al registrar uso: " + err.message); }
      };

      const handleDelete = async (id, name) => {
        if (!currentUser?.isSuperAdmin) return;
        if (window.confirm("¿Seguro que deseas eliminar permanentemente este anticuerpo?")) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos', id));
          if(view === 'detail') setView('catalog');
        }
      };

      const toggleManualAlert = async (id, currentStatus) => {
         try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos', id), { manualAlert: !currentStatus }, { merge: true }); } 
         catch(e) { console.error(e); }
      };

      const toggleSealStatus = async (id, currentStatus) => {
         try {
           const newStatus = currentStatus === 'sealed' ? 'in_use' : 'sealed';
           await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'inv_anticuerpos', id), { sealStatus: newStatus }, { merge: true });
           if(newStatus === 'in_use') await logAction(id, selectedItemDetail?.target || 'Anticuerpo', 'modificado', 'El vial se marcó como abierto/en uso.');
         } catch(e) { console.error(e); }
      };

      const handleSendPurchaseRequest = (item) => {
        const emailTo = "nnajerag@ipn.mx"; 
        const subject = encodeURIComponent(`Solicitud de Compra / Reabastecimiento: Anti-${item.target || item.name}`);
        const bodyText = `Estimada Dra. Nayelli Nájera,

Por medio del presente correo, solicito formalmente la compra o reabastecimiento del siguiente anticuerpo, el cual requiere atención en el inventario.

--- DETALLES TÉCNICOS ---
• Target / Especificidad: Anti-${item.target || item.name}
• Hospedero (Host): ${item.host || 'N/A'}
• Marca y Catálogo: ${item.brand || 'N/A'} / ${item.catalogNum || 'N/A'}
• Stock Actual: ${item.qty} ${item.unit}

--- ENLACES Y REFERENCIAS ---
• Enlace de compra: ${item.purchaseLink || 'No especificado en sistema'}
• Referencia Visual: ${item.imageUrls?.[0] || item.imageUrl || 'No se subió fotografía'}

Atentamente,
${currentUser.name || currentUser.email}
(Vía LabManager Pro)`;

        window.location.href = `mailto:${emailTo}?subject=${subject}&body=${encodeURIComponent(bodyText)}`;
      };

      const handleExportCSV = () => {
        if (!currentUser?.isSuperAdmin) return alert("Solo administradores.");
        const headers = ['ID/Codigo', 'Target_Especificidad', 'Hospedero', 'Catalogo', 'Lote', 'Marca', 'Cantidad', 'Unidad', 'Estado_Fisico', 'Alerta_Manual', 'Ubicacion_Lab', 'Ubicacion_Caja', 'Caducidad', 'Enlace_Compra', 'Notas'];
        const rows = anticuerpos.map(i => {
          const notes = i.notes ? i.notes.replace(/"/g, '""').replace(/\n/g, ' ') : '';
          const target = i.target || i.name || '';
          return [ `"${i.barcode||i.id}"`, `"${target}"`, `"${i.host||''}"`, `"${i.catalogNum||''}"`, `"${i.lotNum||''}"`, `"${i.brand||''}"`, i.qty, `"${i.unit||''}"`, `"${i.sealStatus === 'in_use' ? 'En Uso' : 'Sellado'}"`, `"${i.manualAlert ? 'SI' : 'NO'}"`, `"${i.locationLab||''}"`, `"${i.locationBox||''}"`, `"${i.expirationDate||''}"`, `"${i.purchaseLink||''}"`, `"${notes}"` ];
        });
        const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(e => e.join(','))].join("\n");
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Anticuerpos_LabManager_${new Date().toLocaleDateString().replace(/\//g,'-')}.csv`;
        document.body.appendChild(link); link.click(); document.body.removeChild(link);
      };

      const handlePrintAllLabels = () => {
        const printWindow = window.open('', '_blank');
        if (anticuerpos.length === 0) return alert("No hay elementos para imprimir.");

        let labelsHtml = anticuerpos.map(item => {
          const code = item.barcode || item.id;
          const title = item.target ? `Anti-${item.target}` : item.name;
          const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=80x80&data=${encodeURIComponent(code)}`;
          const barcodeUrl = `https://bwipjs-api.metafloor.com/?bcid=code128&text=${encodeURIComponent(code)}&scaleX=2&scaleY=1&includetext=true`;
          
          return `
            <div class="label-box">
              <div class="title">${title} <br/><span style="font-weight:normal; font-size:9px;">(${item.host || 'N/A'})</span></div>
              <div class="codes">
                 <img src="${qrUrl}" alt="QR" class="qr" />
                 <img src="${barcodeUrl}" alt="Barcode" class="barcode" />
              </div>
              <div class="meta"><strong>Lote:</strong> ${item.lotNum || '--'} | <strong>Caja:</strong> ${item.locationBox || '--'}</div>
            </div>
          `;
        }).join('');

        printWindow.document.write(`
          <html><head><title>Catálogo de Anticuerpos</title><style>
            body { font-family: sans-serif; margin: 0; padding: 20px; background: #fff;}
            .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7cm, 1fr)); gap: 15px; }
            .label-box { border: 1px dashed #666; padding: 10px; display: flex; flex-direction: column; align-items: center; text-align: center; border-radius: 4px;}
            .title { font-size: 11px; font-weight: bold; margin-bottom: 8px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
            .codes { display: flex; gap: 10px; align-items: center; justify-content: center; width: 100%;}
            .qr { width: 50px; height: 50px; }
            .barcode { height: 40px; max-width: 120px; object-fit: contain; }
            .meta { font-size: 10px; color: #333; margin-top: 8px; border-top: 1px solid #eee; padding-top: 4px; width: 100%;}
            @media print { body { padding: 0; } .label-box { page-break-inside: avoid; border: 1px solid #000; } }
          </style></head><body>
            <h2 style="text-align:center; margin-bottom: 20px;">Catálogo General de Etiquetas de Anticuerpos</h2>
            <div class="grid">${labelsHtml}</div>
            <script>setTimeout(() => { window.print(); }, 2000); <\/script>
          </body></html>
        `);
        printWindow.document.close();
      };

      const formatDate = (isoString) => new Date(isoString).toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
      const openDetailView = (item) => { setSelectedItemDetail(item); setView('detail'); };

      if (loading) return <div className="h-screen flex items-center justify-center bg-slate-50"><div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div></div>;
      if (!currentUser) return (
        <div className="min-h-screen flex items-center justify-center bg-slate-900 p-4">
          <div className="bg-white p-8 rounded-2xl shadow-xl text-center max-w-sm w-full">
            <ShieldAlert className="mx-auto text-orange-500 mb-4" size={48} />
            <h2 className="text-xl font-bold mb-2">Acceso Restringido</h2>
            <p className="text-gray-600 mb-6">Debes iniciar sesión en la aplicación principal (LabManager) para acceder a este módulo.</p>
            <a href="index.html" className="block w-full py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700">Ir a LabManager</a>
          </div>
        </div>
      );

      const filteredAnticuerpos = anticuerpos.filter(i => (i.target||i.name).toLowerCase().includes(searchQuery.toLowerCase()) || i.catalogNum?.includes(searchQuery) || i.brand?.toLowerCase().includes(searchQuery.toLowerCase()) || i.host?.toLowerCase().includes(searchQuery.toLowerCase()) || i.locationBox?.toLowerCase().includes(searchQuery.toLowerCase()));

      return (
        <div className="min-h-screen pb-12 bg-slate-50 relative">
          
          <div className="bg-gradient-to-r from-indigo-700 via-purple-700 to-indigo-900 pb-24 pt-8 px-4 md:px-8 shadow-lg">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-4 text-white">
                <div className="bg-white/20 p-3 rounded-2xl backdrop-blur-sm"><Beaker size={32} /></div>
                <div><h1 className="text-3xl font-black tracking-tight">Inventario de Anticuerpos</h1><p className="text-indigo-200 font-medium text-sm mt-1">Módulo Especializado LabManager</p></div>
              </div>
              <div className="flex flex-wrap items-center justify-center gap-3 w-full md:w-auto">
                <a href="index.html" className="px-4 py-2 bg-white/10 text-white rounded-xl hover:bg-white/20 transition-colors font-bold flex items-center gap-2 backdrop-blur-sm"><ArrowLeft size={18}/> Dashboard</a>
                {currentUser.isSuperAdmin && (
                  <button onClick={() => setShowGlobalHistory(true)} className="px-4 py-2 bg-white/10 text-white rounded-xl hover:bg-white/20 transition-colors font-bold flex items-center gap-2 backdrop-blur-sm" title="Historial Global"><History size={18}/></button>
                )}
                {currentUser.isSuperAdmin && view === 'catalog' && (
                  <button onClick={() => {setEditingItem(null); setImagePreviews([]); setShowForm(true);}} className="flex-1 md:flex-none px-6 py-2 bg-white text-indigo-700 rounded-xl font-bold hover:bg-indigo-50 shadow-xl transition-all">+ Registrar Nuevo</button>
                )}
              </div>
            </div>
          </div>

          <div className="max-w-7xl mx-auto px-4 md:px-8 -mt-16">
            
            {}
            {view === 'catalog' && (
              <div className="animate-fade-in">
                <div className="bg-white rounded-2xl shadow-md p-4 mb-8 flex flex-col md:flex-row justify-between items-center gap-4 border border-gray-100">
                  <div className="flex items-center gap-2 bg-slate-100 p-3 rounded-xl flex-1 w-full focus-within:ring-2 ring-indigo-500 transition-all">
                    <Search className="text-indigo-400 mx-2" size={20} />
                    <input type="text" placeholder="Buscar por Anti (Especificidad), Hospedero, Caja, Marca..." className="w-full bg-transparent outline-none font-medium text-gray-700" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} />
                  </div>
                  {currentUser.isSuperAdmin && (
                    <div className="flex gap-2 w-full md:w-auto">
                       <button onClick={handlePrintAllLabels} className="flex-1 md:flex-none px-4 py-3 bg-slate-800 text-white rounded-xl hover:bg-slate-900 font-bold flex items-center justify-center gap-2 shadow-sm transition-colors" title="Imprimir Etiquetas"><Printer size={18}/></button>
                       <button onClick={handleExportCSV} className="flex-1 md:flex-none px-4 py-3 bg-emerald-600 text-white rounded-xl hover:bg-emerald-700 font-bold flex items-center justify-center gap-2 shadow-sm transition-colors" title="Descargar Base a Excel"><Download size={18}/></button>
                    </div>
                  )}
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {filteredAnticuerpos.map(item => {
                    const displayImg = item.imageUrls?.[0] || item.imageUrl;
                    return (
                    <div key={item.id} onClick={() => openDetailView(item)} className={`bg-white rounded-3xl border-2 ${item.manualAlert ? 'border-red-300 shadow-[0_0_15px_rgba(239,68,68,0.2)]' : 'border-transparent shadow-sm'} hover:shadow-xl hover:-translate-y-1 hover:border-indigo-300 transition-all duration-300 flex flex-col overflow-hidden group cursor-pointer relative`}>
                      
                      <div className="absolute top-3 left-3 flex gap-1 z-20">
                        {item.sealStatus === 'in_use' ? (
                           <span className="bg-amber-100/90 text-amber-700 text-[10px] font-black uppercase px-2 py-1 rounded shadow-sm backdrop-blur border border-amber-200 flex items-center gap-1"><PackageOpen size={10}/> En Uso</span>
                        ) : (
                           <span className="bg-emerald-100/90 text-emerald-700 text-[10px] font-black uppercase px-2 py-1 rounded shadow-sm backdrop-blur border border-emerald-200 flex items-center gap-1"><Package size={10}/> Sellado</span>
                        )}
                      </div>
                      
                      {item.manualAlert && <span className="absolute top-3 right-3 bg-red-500 text-white text-[10px] font-black uppercase px-2 py-1 rounded shadow-md flex items-center gap-1 z-20 animate-pulse"><Bell size={10}/> Alerta</span>}

                      <div className="h-40 bg-slate-50 relative flex items-center justify-center p-4 border-b border-slate-100">
                        {displayImg ? <img src={displayImg} className="h-full object-contain mix-blend-multiply drop-shadow-md group-hover:scale-110 transition-transform duration-500" /> : <ImageIcon className="text-slate-300" size={56}/>}
                      </div>
                      
                      <div className="p-5 flex flex-col flex-1">
                        <div className="mb-2">
                           <span className="inline-block px-2 py-0.5 bg-indigo-100 text-indigo-700 text-[10px] font-black rounded-md uppercase tracking-widest border border-indigo-200 mb-2">Host: {item.host || 'N/A'}</span>
                           <h3 className="font-black text-gray-900 text-lg leading-tight line-clamp-2" title={item.target || item.name}><span className="text-indigo-400 font-medium text-sm block -mb-1">Anti-</span>{item.target || item.name}</h3>
                        </div>
                        
                        <div className="space-y-2 text-xs text-gray-600 mb-4 flex-1">
                          <p className="flex justify-between border-b border-slate-50 pb-1"><span className="font-bold text-slate-400">Marca</span> <span className="font-medium text-slate-700 truncate ml-2">{item.brand}</span></p>
                          <p className="flex justify-between border-b border-slate-50 pb-1"><span className="font-bold text-slate-400">Catálogo</span> <span className="font-mono bg-slate-100 px-1 rounded text-slate-700">{item.catalogNum || '--'}</span></p>
                          
                          <div className="mt-3 bg-indigo-50/50 p-2 rounded-lg border border-indigo-50">
                            <p className="text-[10px] uppercase font-bold text-indigo-400 flex items-center gap-1 mb-1"><MapPin size={12}/> Ubicación</p>
                            <p className="font-medium text-indigo-900 truncate" title={item.locationLab}>{item.locationLab || 'No especificado'}</p>
                            <p className="font-bold text-indigo-700">{item.locationBox || '--'}</p>
                          </div>
                        </div>
                        
                        <div className="flex items-end justify-between pt-4 border-t border-slate-100 mt-2">
                          <div>
                            <p className="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Disponible</p>

                               <td className="p-4">
                                 <span className={`px-2 py-1 rounded text-[10px] uppercase font-black ${log.action === 'consumido' ? 'bg-orange-100 text-orange-700' : log.action === 'creado' ? 'bg-emerald-100 text-emerald-700' : 'bg-blue-100 text-blue-700'}`}>
                                    {log.action} {log.amountTaken > 0 ? `-${log.amountTaken}` : ''}
                                 </span>
                               </td>
                               <td className="p-4 font-bold text-indigo-700">Anti-{log.itemName}</td>
                               <td className="p-4 text-slate-600 italic">{log.details}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
               </div>
            )}

            {consumeItem && (
               <div className="fixed inset-0 z-[120] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm">
                  <div className="bg-white rounded-3xl shadow-2xl w-full max-w-md animate-fade-in overflow-hidden border border-blue-100">
                    <div className="bg-blue-600 p-6 text-white text-center">
                      <MinusCircle className="mx-auto mb-2 opacity-80" size={40}/>
                      <h2 className="text-2xl font-black">Registrar Uso</h2>
                      <p className="text-blue-100 font-medium">Anti-{consumeItem.target || consumeItem.name}</p>
                    </div>
                    <form onSubmit={handleConsumeSubmit} className="p-6 space-y-5">
                      <div className="bg-slate-50 p-4 rounded-xl border border-slate-100 text-center flex justify-between items-center">
                        <span className="text-sm font-bold text-gray-500 uppercase">Disponible:</span>
                        <span className="text-2xl font-black text-blue-700">{consumeItem.qty} <span className="text-sm text-gray-500">{consumeItem.unit}</span></span>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-600 uppercase mb-2">Cantidad a tomar ({consumeItem.unit}) *</label>
                        <input type="number" step="0.01" name="amount" required max={consumeItem.qty} className="w-full p-4 border border-slate-200 rounded-xl text-center text-xl font-bold focus:border-blue-500 focus:ring-2 ring-blue-200 outline-none" placeholder="0.00" />
                      </div>
                      <div>
                         <label className="block text-xs font-bold text-gray-600 uppercase mb-2">Proyecto o Motivo *</label>
                         <textarea name="reason" required rows="2" className="w-full p-3 border border-slate-200 rounded-xl focus:border-blue-500 outline-none resize-none" placeholder="Ej. WB de extractos M12, Proyecto Dr. Smith"></textarea>
                      </div>
                      <div className="flex gap-3 pt-4">
                        <button type="button" onClick={() => setConsumeItem(null)} className="flex-1 py-3 bg-gray-100 text-gray-700 font-bold rounded-xl hover:bg-gray-200 transition-colors">Cancelar</button>
                        <button type="submit" className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-md shadow-blue-500/20 transition-all">Confirmar Uso</button>
                      </div>
                    </form>
                  </div>
               </div>
            )}
            
          </div>
        </div>
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(<AnticuerposApp />);
  </script>
</body>
</html>
